            "2025-12-22": {

                    { title: "별궁 크리스마스 파티", color: "bg-emerald-100 text-emerald-800 border-emerald-200" }
                ],
                diary: `오전에 오시온이랑 어린이 자선행사 다녀오고, 오후에는 애들이랑 크리스마스 파티함! 밤새 놀려고 했는데 오시온이 잠은 동궁전에서 자야 한다고 고집 피워서 끌려옴. 크리스마스 선물이라고 보석 목걸이 주는데, 감동은 무슨! 앙금 안 풀렸다 너..`
            },
            "2025-12-26": {
                events: [{ title: "황실 연말 감사제 준비", color: "bg-indigo-100 text-indigo-700 border-indigo-200" }],
                diary: null
            },
            "2025-12-29": {
                events: [
                    { title: "겨울방학 시작", color: "bg-pink-100 text-pink-700 border-pink-200" },
                    { title: "연말 종묘제례 교육", color: "bg-indigo-100 text-indigo-700 border-indigo-200" }
                ],
                diary: `드디어 방학... 그러나 황태자비에게 방학이란 없다. 종묘제례 공부 시작함😭`
            },
            "2025-12-31": {
                events: [
                    { title: "보신각 타종행사", color: "bg-indigo-100 text-indigo-700 border-indigo-200" }
                ],
                diary: `보신각 행사 끝나고 황실 별장. 2025년 마지막 날을 별장에서 오시온과 단둘이 보내다니... 내 다사다난 고3 인생 수고했다 진짜...🥹`
            }
        };

        // State
        let currentYear = 2025;
        let currentMonth = 11; // 0-indexed: 11 = December
        let selectedDateStr = "2025-12-31";
        let isBottomSheetOpen = true;

        // Element References
        const lockScreen = document.getElementById('lock-screen');
        const swipeArea = document.getElementById('swipe-area');
        const statusBar = document.getElementById('status-bar');
        const monthSelectorBtn = document.getElementById('month-selector-btn');
        const monthDropdown = document.getElementById('month-dropdown');
        const currentMonthDisplay = document.getElementById('current-month-display');
        const calendarGrid = document.getElementById('calendar-grid');
        const bottomSheet = document.getElementById('bottom-sheet');

        // Sheet Elements
        const sheetDateTitle = document.getElementById('sheet-date-title');
        const sheetEventsContainer = document.getElementById('sheet-events-container');
        const sheetDiaryCard = document.getElementById('sheet-diary-card');
        const sheetDiaryContent = document.getElementById('sheet-diary-content');
        const badgeCount = document.getElementById('badge-count');

        // Unlock Mechanics
        function unlockApp() {
            lockScreen.style.transform = 'translateY(-100%)';
            statusBar.classList.remove('text-white');
            statusBar.classList.add('text-gray-800');
        }

        swipeArea.addEventListener('click', unlockApp);

        // Touch swipe gesture for lock screen
        let startY = 0;
        lockScreen.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        });

        lockScreen.addEventListener('touchend', (e) => {
            let endY = e.changedTouches[0].clientY;
            if (startY - endY > 50) { // Swiped up
                unlockApp();
            }
        });

        // Dropdown toggle
        monthSelectorBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            monthDropdown.classList.toggle('hidden');
        });

        document.addEventListener('click', () => {
            monthDropdown.classList.add('hidden');
        });

        function changeMonth(monthIndex) {
            currentMonth = monthIndex;
            const monthNames = ["10월", "11월", "12월"];
            currentMonthDisplay.textContent = monthNames[monthIndex - 9];
            renderCalendar();
        }

        function todayBtnHandler() {
            currentMonth = 11; // December
            currentMonthDisplay.textContent = "12월";
            selectDate(2025, 11, 31);
            renderCalendar();
        }

        // Render Calendar Grid
        function renderCalendar() {
            calendarGrid.innerHTML = '';

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            // Previous month padding
            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'border-b border-r border-gray-100 p-1 bg-gray-50/50 min-h-[75px]';
                calendarGrid.appendChild(emptyCell);
            }

            // Days of current month
            for (let day = 1; day <= daysInMonth; day++) {
                const dateMonthStr = String(currentMonth + 1).padStart(2, '0');
                const dateDayStr = String(day).padStart(2, '0');
                const dateKey = `${currentYear}-${dateMonthStr}-${dateDayStr}`;

                const dayCell = document.createElement('div');
                const isSelected = (dateKey === selectedDateStr);
                const dayData = calendarData[dateKey];

                const dayOfWeek = new Date(currentYear, currentMonth, day).getDay();
                let textColor = 'text-gray-800';
                if (dayOfWeek === 0) textColor = 'text-red-500';
                if (dayOfWeek === 6) textColor = 'text-blue-500';

                dayCell.className = `border-b border-r border-gray-100 p-1 min-h-[75px] flex flex-col justify-between cursor-pointer transition-colors relative ${isSelected ? 'bg-indigo-50/60' : 'hover:bg-gray-50'}`;
                dayCell.onclick = () => selectDate(currentYear, currentMonth, day);

                // Date Number Header
                let dateBadge = `<span class="text-xs font-semibold ${textColor} ${isSelected ? 'w-5 h-5 rounded-full bg-indigo-600 text-white flex items-center justify-center' : ''}">${day}</span>`;

                let eventsHtml = '';
                if (dayData && dayData.events) {
                    eventsHtml = `<div class="mt-1 space-y-0.5 overflow-hidden">`;
                    dayData.events.forEach(ev => {
                        eventsHtml += `<div class="event-pill text-[9px] px-1 py-0.5 rounded border truncate ${ev.color}">${ev.title}</div>`;
                    });
                    eventsHtml += `</div>`;
                }

                // Small Indicator if Diary exists
                let diaryDot = '';
                if (dayData && dayData.diary) {
                    diaryDot = `<span class="w-1.5 h-1.5 rounded-full bg-pink-400 absolute top-1.5 right-1.5"></span>`;
                }

                dayCell.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center">${dateBadge}</div>
                        ${eventsHtml}
                    </div>
                    ${diaryDot}
                `;

                calendarGrid.appendChild(dayCell);
            }
        }

        // Select Date Handler
        function selectDate(year, month, day) {
            const dateMonthStr = String(month + 1).padStart(2, '0');
            const dateDayStr = String(day).padStart(2, '0');
            selectedDateStr = `${year}-${dateMonthStr}-${dateDayStr}`;

            const dateObj = new Date(year, month, day);
            const daysKo = ['일', '월', '화', '수', '목', '금', '토'];
            const dayName = daysKo[dateObj.getDay()];

            sheetDateTitle.textContent = `${month + 1}월 ${day}일 (${dayName})`;

            const data = calendarData[selectedDateStr];

            // Render Events
            sheetEventsContainer.innerHTML = '';
            if (data && data.events && data.events.length > 0) {
                badgeCount.textContent = `일정 ${data.events.length}개`;
                data.events.forEach(ev => {
                    const pill = document.createElement('div');
                    pill.className = `px-3 py-2 rounded-xl text-xs font-semibold flex items-center border ${ev.color}`;
                    pill.innerHTML = `<i class="fa-solid fa-circle text-[6px] mr-2"></i> ${ev.title}`;
                    sheetEventsContainer.appendChild(pill);
                });
            } else {
                badgeCount.textContent = `일정 없음`;
                sheetEventsContainer.innerHTML = `<p class="text-xs text-gray-400 italic">(등록된 일정이 없습니다)</p>`;
            }

            // Render Diary
            if (data && data.diary) {
                sheetDiaryCard.classList.remove('hidden');
                sheetDiaryContent.textContent = data.diary;
            } else {
                sheetDiaryCard.classList.remove('hidden');
                sheetDiaryContent.textContent = "(등록된 메모가 없습니다)";
            }

            renderCalendar();
            openBottomSheet();
        }

        function toggleBottomSheet() {
            if (isBottomSheetOpen) {
                bottomSheet.style.transform = 'translateY(calc(100% - 40px))';
            } else {
                bottomSheet.style.transform = 'translateY(0)';
            }
            isBottomSheetOpen = !isBottomSheetOpen;
        }

        function openBottomSheet() {
            bottomSheet.style.transform = 'translateY(0)';
            isBottomSheetOpen = true;
        }

        // Initialize App to Dec 31, 2025
        window.onload = function() {
            selectDate(2025, 11, 31);
            renderCalendar();
        };
    </script>
</body>
